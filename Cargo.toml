workspace = {members = ["proc_macros"]}

[package]
name = "chess"
version = "0.2.0"
edition = "2021"
resolver="2"



# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dev-dependencies]
criterion = "0.5.1"
paste = "1.0.15"
proc_macros = {path = "./proc_macros"}

[[bench]]
name="my_benchmark"
harness=false

[profile.release]
lto=true
codegen-units=1
debug=true

[dependencies]
ahash = "0.8.11"
chashmap = "2.2.2"
once_cell = "1.19.0"

[features]
default = ["hashmap"]
hashmap = []
concurrent_hashmap = ["hashmap"]
